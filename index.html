<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A word puzzle game where you connect letters to form the fewest words possible. Uses Bananagrams-style letter distribution with drag-and-drop gameplay.">
    <meta name="keywords" content="word game, puzzle, bananagrams, scrabble, letters, minimum words">
    <meta name="author" content="Minimum Words Game">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Minimum Words Game">
    <meta property="og:description" content="Connect all letters to form the fewest words possible! A challenging word puzzle game.">
    <meta property="og:url" content="https://conniexu444.github.io/word-game/">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Minimum Words Game">
    <meta name="twitter:description" content="Connect all letters to form the fewest words possible! A challenging word puzzle game.">

    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea">

    <title>Minimum Words Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Minimum Words Game</h1>
            <p>Connect all letters to form the fewest words possible!</p>
        </header>

        <div class="game-info">
            <div class="info-item">
                <span class="label">Letters:</span>
                <span id="letter-count" class="value">8</span>
            </div>
            <div class="info-item">
                <span class="label">Words Found:</span>
                <span id="word-count" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">Letters Placed:</span>
                <span id="placed-count" class="value">0/8</span>
            </div>
        </div>

        <div class="game-board">
            <div id="grid" class="grid"></div>
        </div>

        <div class="letter-bank-container">
            <h3>Available Letters</h3>
            <div id="letter-bank" class="letter-bank"></div>
        </div>

        <div class="controls">
            <button id="new-game" class="btn btn-primary">New Game</button>
            <button id="validate" class="btn btn-secondary">Validate Words</button>
            <button id="clear-board" class="btn btn-secondary">Clear Board</button>
        </div>

        <div id="validation-results" class="validation-results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
